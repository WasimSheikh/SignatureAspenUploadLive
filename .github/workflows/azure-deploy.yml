name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          NODE_ENV: production
          APP_URL: https://fileshare2.signatureaspen.com
          DATABASE_URL: postgresql://placeholder@localhost/placeholder
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          GRAPH_SENDER_EMAIL: ${{ secrets.GRAPH_SENDER_EMAIL }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_ALLOWED_GROUP_IDS: ${{ secrets.ENTRA_ALLOWED_GROUP_IDS }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Bundle standalone for deployment
        run: |
          # Copy contents (trailing /.) so dest dir nesting is correct
          # whether or not .next/standalone/.next/static already exists
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/
          mkdir -p .next/standalone/public
          cp -r public/. .next/standalone/public/ 2>/dev/null || true
          echo "CSS files in standalone:"
          find .next/standalone/.next/static -name "*.css" | head -5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy standalone to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: signaturefileupload
          resource-group-name: signaturefileupload_group
          package: .next/standalone
