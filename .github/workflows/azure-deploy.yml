name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          APP_URL: https://signaturefileupload-c3gna0hwffapbfc0.westus3-01.azurewebsites.net
          DATABASE_URL: postgresql://placeholder@localhost/placeholder
          AZURE_STORAGE_ACCOUNT_NAME: sigaspenfiles
          AZURE_STORAGE_CONTAINER: design-transfers
          GRAPH_SENDER_EMAIL: noreply@signatureaspen.com
          COOKIE_SECRET: build-placeholder-not-used-at-build-time
          CRON_SECRET: build-placeholder-not-used-at-build-time

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: signaturefileupload
          resource-group-name: signaturefileupload_group
          package: .
